services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agenticweb
      POSTGRES_PASSWORD: agenticweb_dev_only
      POSTGRES_DB: agenticweb
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenticweb"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
