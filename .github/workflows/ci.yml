name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs (tag in the comment); Dependabot keeps them current.
env:
  PG_URL: postgresql://agenticweb:agenticweb_dev_only@localhost:5432/agenticweb

jobs:
  verify:
    name: Lint, types, tests (Postgres), build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: agenticweb, POSTGRES_PASSWORD: agenticweb_dev_only, POSTGRES_DB: agenticweb }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agenticweb" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://agenticweb:agenticweb_dev_only@localhost:5432/agenticweb
      DATABASE_URL_TEST: postgresql://agenticweb:agenticweb_dev_only@localhost:5432/agenticweb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm tsc --noEmit
      - run: pnpm db:deploy
      - run: pnpm test:run   # includes Postgres integration tests (DATABASE_URL_TEST)
      - run: pnpm build

  audit:
    name: Dependency audit (fails on high/critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level=high

  e2e:
    name: Playwright E2E (skips until the frontend adds playwright.config.ts)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: agenticweb, POSTGRES_PASSWORD: agenticweb_dev_only, POSTGRES_DB: agenticweb }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agenticweb" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://agenticweb:agenticweb_dev_only@localhost:5432/agenticweb
      DEV_AUTH_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect Playwright setup
        id: detect
        run: |
          if ls playwright.config.* >/dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"; else
            echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::No playwright.config.* yet — E2E job is a placeholder and passes."; fi
      - if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - if: steps.detect.outputs.present == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm db:deploy && pnpm db:seed
          pnpm exec playwright install --with-deps chromium
          pnpm build
          pnpm exec playwright test
      - if: steps.detect.outputs.present == 'true' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: playwright-report, path: "playwright-report/\ntest-results/", if-no-files-found: ignore, retention-days: 14 }

  infra-lint:
    name: Dockerfile, workflows, observability config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with: { dockerfile: Dockerfile, failure-threshold: warning }
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Prometheus rules + config (promtool)
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/observability:/o" prom/prometheus:v3.16.0 check rules /o/alerts.rules.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/observability:/o" prom/prometheus:v3.16.0 test rules /o/alerts.test.yml
      - name: OTel Collector config
        run: docker run --rm -v "$PWD/deploy/observability/otel-collector.yaml:/c.yaml:ro" otel/opentelemetry-collector-contrib:0.165.0 validate --config=/c.yaml
      - name: Grafana dashboard JSON
        run: |
          for f in deploy/observability/grafana/dashboards/*.json; do jq -e '.panels | length > 0 and (.uid | length > 0)' "$f" >/dev/null && echo "ok $f"; done
      - name: Compose files
        run: docker compose --profile app --profile observability config -q

  container:
    name: Image build, scan (Trivy + Grype), SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build runner image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          load: true
          push: false
          tags: agenticweb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (non-root user, health endpoint)
        run: |
          test "$(docker run --rm --entrypoint id agenticweb:ci -u)" != "0"
          docker run -d --name smoke -p 3000:3000 -e DATABASE_URL=postgresql://u:p@127.0.0.1:5432/db agenticweb:ci
          for i in $(seq 1 30); do curl -fs localhost:3000/api/health && break; sleep 1; done
          curl -fs localhost:3000/api/health
          docker inspect --format '{{.State.Health.Status}}' smoke
          docker rm -f smoke
      - name: Trivy image scan (fails on HIGH/CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agenticweb:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Grype image scan (fails on high+)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: agenticweb:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
      - name: Trivy repo scan (secrets, Dockerfile/compose misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: node_modules,.next
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agenticweb:ci
          format: cyclonedx
          output: sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sbom-cyclonedx, path: sbom.cdx.json, retention-days: 90 }
