name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: agenticweb, POSTGRES_PASSWORD: agenticweb_dev_only, POSTGRES_DB: agenticweb }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agenticweb" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://agenticweb:agenticweb_dev_only@localhost:5432/agenticweb
      DATABASE_URL_TEST: postgresql://agenticweb:agenticweb_dev_only@localhost:5432/agenticweb
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm tsc --noEmit
      - run: pnpm db:deploy
      - run: pnpm test:run   # includes Postgres integration tests (DATABASE_URL_TEST)
      - run: pnpm build

  # Phase 6 (QA): agentic E2E over the real app, deterministic evals, and Playwright — all on DISPOSABLE agenticweb_qa_* databases
  # created by tests/agentic/support/with-test-db.ts (never the service's main database). Independent of `verify` so failures are visible in parallel.
  agentic:
    name: Agentic E2E, evals and Playwright (isolated DB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: agenticweb, POSTGRES_PASSWORD: agenticweb_dev_only, POSTGRES_DB: agenticweb }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agenticweb" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://agenticweb:agenticweb_dev_only@localhost:5432/agenticweb
      QA_ADMIN_DATABASE_URL: postgresql://agenticweb:agenticweb_dev_only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Agentic E2E + negative suites (MCP SDK client, mock issuer, real app)
        run: pnpm test:agentic
      - name: Deterministic evals (fixed dataset v1; gates - success >= 95%, authz safety 100%, txn correctness 100%)
        run: pnpm eval
      - name: Playwright E2E (human UI, channel parity, WebMCP)
        run: pnpm test:e2e:isolated
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: qa-reports, path: "evals/results/\nplaywright-report/\ntest-results/", if-no-files-found: ignore, retention-days: 14 }
